; Kopio nimella settings.ini - tai anna RUN_ALL.bat:n luoda se ensimmaisella ajolla.
; Taalla ovat kaikki koneesta riippuvat polut ja renderoinnin asetukset.

[paths]
; SCUMin paketit. Loytyy yleensa automaattisesti Steamin kirjastoista.
paks = C:\Program Files (x86)\Steam\steamapps\common\SCUM\SCUM\Content\Paks
; Pakettien AES-avain. Jata tyhjaksi jos paketteja ei ole salattu.
aes =
blender = C:\Program Files\Blender Foundation\Blender 4.2\blender.exe
; Taytetaan automaattisesti kun DumpWorld on kaannetty.
dumpworld =

[render]
; Lopullisen neliokuvan sivu pikseleina.
output_px = 32768
; Tiilia per akseli. 16 = 256 tiilta a 2048 px. Jos 8 GB VRAM loppuu
; metsaisilla tiileilla, nosta 32:een (sama tarkkuus, neljasosa muistia).
tile_grid = 16
; cycles = lopullinen laatu, eevee = nopea esikatselu
engine = cycles
samples = 256
