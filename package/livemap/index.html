<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tesles NPC Overhaul · Live Map</title>
<meta name="description" content="Live map of the Tesles NPC Overhaul squads roaming a SCUM server.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23e0b673' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23f07070'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="mapWrap">
    <canvas id="map"></canvas>

    <div class="hud" id="hudTop">
      <div class="chip" id="chipLink">Connecting…</div>
      <div class="chip" id="chipPop">NPCs – · Squads –</div>
      <div class="chip" id="chipPhys">Physical –</div>
      <div class="chip ghost" id="chipTick">tick –</div>
    </div>

    <div class="hud" id="hudTools">
      <button id="btnFit" title="Fit the whole map">Fit map</button>
      <button id="btnRoutes" class="on" title="Show planned routes">Routes</button>
      <button id="btnQueue" class="on" title="Show each squad's next 3 destinations">Queue</button>
      <button id="btnPois" class="on" title="Show places (towns, bunkers, towers...)">Places</button>
      <button id="btnTrails" class="on" title="Show the trails squads walked">Trails</button>
      <button id="btnLabels" title="Show squad names">Names</button>
      <button id="btnGrid" class="on" title="Show the sector grid">Grid</button>
    </div>

    <div class="hud" id="hudFoot">
      <div id="legend"></div>
      <div class="chip ghost" id="chipCoords">X – / Y – / –</div>
    </div>

    <div id="tip"></div>
  </div>

  <aside>
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>TESLES <span>NPC OVERHAUL</span></h1>
          <div class="sub">Living squads for SCUM servers · <b id="verLabel">–</b></div>
        </div>
      </div>
      <a class="discord" href="https://discord.gg/7TFs9VTzEs" target="_blank" rel="noopener"
         title="Join the Discord - by Porvarinen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.7 19.7 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.6 19.6 0 0 0-4.9 1.4C.6 9 .1 13.5.3 18a19.8 19.8 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.4a14.1 14.1 0 0 0 12 0l.5.4a12.7 12.7 0 0 1-2 1l1.3 2a19.7 19.7 0 0 0 6-3c.4-5.2-.7-9.6-3.6-13.6ZM8.5 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Z"/></svg>
        <span>Discord</span>
      </a>
    </header>

    <div class="tabs">
      <button data-tab="world" class="on">World</button>
      <button data-tab="groups">Squads</button>
      <button data-tab="detail">Selected</button>
      <button data-tab="feed">Events</button>
    </div>

    <div class="scroll" id="panel"></div>

    <footer>
      <span>by <b>Porvarinen</b></span>
      <a href="https://discord.gg/7TFs9VTzEs" target="_blank" rel="noopener">discord.gg/7TFs9VTzEs</a>
      <span class="credit">Map: TripplExN · Loader: UE4SS · MIT</span>
    </footer>
  </aside>

</div>
<script src="pois.js"></script>
<script src="app.js"></script>
</body>
</html>
